services:
  db:
    image: postgres:16-alpine
    container_name: caidelec-db
    environment:
      POSTGRES_DB: caidelec_planning
      POSTGRES_USER: caidelec
      POSTGRES_PASSWORD: caidelec
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U caidelec -d caidelec_planning"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: caidelec-api
    environment:
      DATABASE_URL: postgresql+psycopg://caidelec:caidelec@db:5432/caidelec_planning
      SECRET_KEY: change-this-secret-in-production
      CORS_ORIGINS: '["http://localhost:5173","http://127.0.0.1:5173"]'
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "python -m app.db.seed && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build: ./frontend
    container_name: caidelec-web
    environment:
      VITE_API_URL: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
